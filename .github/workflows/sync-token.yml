name: Auto Sync AntPing Token

on:
  schedule:
    # 每 25 分钟触发一次
    - cron: '*/25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装项目依赖
        run: npm install

      - name: 运行爬虫抓取 Token
        run: node index.js

      - name: 自动提交更新后的 token.txt 到私有仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add token.txt
          git commit -m "Auto update token [skip ci]" || exit 0
          git push
