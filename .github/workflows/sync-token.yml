name: Auto Sync AntPing Token

on:
  schedule:
    # 每 25 分钟调度一次
    - cron: '*/25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装项目依赖
        run: npm install

      # 在启动爬虫前加入随机延迟
      - name: 随机防风控等待
        run: |
          DELAY=$((10 + RANDOM % 110))
          echo "随机休眠 ${DELAY} 秒后执行抓取..."
          sleep $DELAY

      - name: 运行爬虫抓取 Token
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          BTN_TEXT: ${{ secrets.BTN_TEXT }}
        run: node index.js

      - name: 自动提交更新后的 token.txt 到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add token.txt
          if git diff --staged --quiet; then
            echo "Token 无变动，跳过提交"
          else
            git commit -m "Auto update token [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
